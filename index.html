    <!-- Babel CDN for JSX transpilation -->

<body class="bg-slate-100 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">

    <script type="text/babel">

        const initialWarehouses = [

        const initialProducts = [

            },
            {

                name: 'قارورة كرتونية عازلة',

                color: 'بني طبيعي',
                price: 199.00, 
                cost: 95.00, 
                stock: 8, 
                reorderLevel: 12, 
                warehouseId: 'wh-2',
                packageImage: 'https://placehold.co/400x400/8b5cf6/ffffff?text=صورة+العبوة+4',
                labelImage: 'https://placehold.co/400x400/14b8a6/ffffff?text=صورة+الملصق+4'
            },
            { 
                id: 'prod-5', 
                code: 'PRD-1005', 
                name: 'برطمان حماية مضاد للتسرب', 
                caliber: 'عيار 18', 
                capacity: '750 مل', 
                color: 'أسود مطفي',
                price: 159.99, 
                cost: 70.00, 
                stock: 60, 
                reorderLevel: 15, 
                warehouseId: 'wh-3',
                packageImage: 'https://placehold.co/400x400/f97316/ffffff?text=صورة+العبوة+5',
                labelImage: 'https://placehold.co/400x400/06b6d4/ffffff?text=صورة+الملصق+5'
            }
        ];

        const initialCustomers = [
            { id: 'cust-1', name: 'شركة أكمي للتكنولوجيا', email: 'info@acme-corp.com', phone: '+966 50 123 4567', address: 'طريق الملك فهد، الرياض', status: 'نشط' },
            { id: 'cust-2', name: 'مؤسسة الحلول المبتكرة', email: 'contact@innovative.sa', phone: '+966 55 987 6543', address: 'شارع العليا، الرياض', status: 'نشط' },
            { id: 'cust-3', name: 'مجموعة الاستشارات العالمية', email: 'billing@globaltech.com', phone: '+966 53 444 3322', address: 'حي الزهراء، جدة', status: 'نشط' },
            { id: 'cust-4', name: 'استوديو أيبكس للتصميم', email: 'hello@apexdesign.co', phone: '+966 51 000 1122', address: 'حي الشاطئ، الدمام', status: 'نشط' }
        ];

        const initialSalesOrders = [
            { id: 'so-101', orderNo: 'SO-2026-001', customerId: 'cust-1', date: '2026-09-20', total: 1148.48, status: 'مكتمل', items: [{ productId: 'prod-1', qty: 2, price: 299.99 }, { productId: 'prod-2', qty: 1, price: 549.50 }] },
            { id: 'so-102', orderNo: 'SO-2026-002', customerId: 'cust-2', date: '2026-09-24', total: 718.00, status: 'قيد المعالجة', items: [{ productId: 'prod-3', qty: 6, price: 119.00 }] },
            { id: 'so-103', orderNo: 'SO-2026-003', customerId: 'cust-4', date: '2026-09-27', total: 199.00, status: 'معلق', items: [{ productId: 'prod-4', qty: 1, price: 199.00 }] }
        ];

        const initialPurchaseOrders = [
            { id: 'po-501', poNo: 'PO-2026-088', supplier: 'شركة التقنية العالمية المحدودة', warehouseId: 'wh-1', date: '2026-09-15', total: 3200.00, status: 'تم الاستلام', items: [{ productId: 'prod-2', qty: 10, cost: 320.00 }] },
            { id: 'po-502', poNo: 'PO-2026-089', supplier: 'مصنع الأثاث العصري', warehouseId: 'wh-2', date: '2026-09-25', total: 1140.00, status: 'معلق', items: [{ productId: 'prod-4', qty: 12, cost: 95.00 }] }
        ];

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3500);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgColor = type === 'error' ? 'bg-rose-600' : type === 'warning' ? 'bg-amber-500' : 'bg-emerald-600';
            const icon = type === 'error' ? 'fa-circle-xmark' : type === 'warning' ? 'fa-triangle-exclamation' : 'fa-circle-check';

            return (
                <div className={`fixed bottom-5 left-5 flex items-center gap-3 text-white px-5 py-3.5 rounded-xl shadow-2xl z-50 transition-all duration-300 animate-bounce ${bgColor}`}>
                    <i className={`fa-solid ${icon} text-xl`}></i>
                    <span className="font-semibold text-sm">{message}</span>
                    <button onClick={onClose} className="mr-4 hover:opacity-75"><i className="fa-solid fa-xmark"></i></button>
                </div>
            );
        };

        const Modal = ({ isOpen, onClose, title, children }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-40 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity">
                    <div className="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
                        <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-slate-50/50">
                            <h3 className="font-bold text-lg text-slate-800">{title}</h3>
                            <button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-200/60 transition">
                                <i className="fa-solid fa-xmark text-lg"></i>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            // حالة التطبيق والتنقل
            const [activeTab, setActiveTab] = useState('dashboard');
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('nexerp_ar_products')) || initialProducts);
            const [warehouses, setWarehouses] = useState(() => JSON.parse(localStorage.getItem('nexerp_ar_warehouses')) || initialWarehouses);
            const [customers, setCustomers] = useState(() => JSON.parse(localStorage.getItem('nexerp_ar_customers')) || initialCustomers);
            const [salesOrders, setSalesOrders] = useState(() => JSON.parse(localStorage.getItem('nexerp_ar_sales')) || initialSalesOrders);
            const [purchaseOrders, setPurchaseOrders] = useState(() => JSON.parse(localStorage.getItem('nexerp_ar_purchases')) || initialPurchaseOrders);
            
            // حالة التنبيهات
            const [toast, setToast] = useState(null);
            const showToast = (message, type = 'success') => setToast({ message, type });

            // حالة النوافذ المنبثقة
            const [isProductModalOpen, setIsProductModalOpen] = useState(false);
            const [isSalesModalOpen, setIsSalesModalOpen] = useState(false);
            const [isPurchaseModalOpen, setIsPurchaseModalOpen] = useState(false);
            const [isCustomerModalOpen, setIsCustomerModalOpen] = useState(false);
            const [isTransferModalOpen, setIsTransferModalOpen] = useState(false);

            // حفظ التغييرات في التخزين المحلي
            useEffect(() => { localStorage.setItem('nexerp_ar_products', JSON.stringify(products)); }, [products]);
            useEffect(() => { localStorage.setItem('nexerp_ar_warehouses', JSON.stringify(warehouses)); }, [warehouses]);
            useEffect(() => { localStorage.setItem('nexerp_ar_customers', JSON.stringify(customers)); }, [customers]);
            useEffect(() => { localStorage.setItem('nexerp_ar_sales', JSON.stringify(salesOrders)); }, [salesOrders]);
            useEffect(() => { localStorage.setItem('nexerp_ar_purchases', JSON.stringify(purchaseOrders)); }, [purchaseOrders]);

            // قائمة المنتجات منخفضة المخزون
            const lowStockItems = useMemo(() => {
                return products.filter(p => p.stock <= p.reorderLevel);
            }, [products]);

            // إضافة منتج جديد
            const handleAddProduct = (newProd) => {
                const prod = {
                    ...newProd,
                    id: 'prod-' + Date.now(),
                    price: parseFloat(newProd.price),
                    cost: parseFloat(newProd.cost),
                    stock: parseInt(newProd.stock),
                    reorderLevel: parseInt(newProd.reorderLevel)
                };
                setProducts([...products, prod]);
                setIsProductModalOpen(false);
                showToast(`تم إضافة المنتج "${prod.name}" بنجاح!`);
            };

            // إضافة عميل جديد
            const handleAddCustomer = (newCust) => {
                const cust = { ...newCust, id: 'cust-' + Date.now(), status: 'نشط' };
                setCustomers([...customers, cust]);
                setIsCustomerModalOpen(false);
                showToast(`تم تسجيل العميل "${cust.name}" بنجاح!`);
            };

            // إنشاء أمر بيع وخصم المخزون تلقائياً
            const handleCreateSalesOrder = (soData) => {
                // التحقق من توفر الكميات
                for (const item of soData.items) {
                    const product = products.find(p => p.id === item.productId);
                    if (!product || product.stock < item.qty) {
                        showToast(`المخزون غير كافٍ للمنتج ${product ? product.name : 'المحدد'}!`, 'error');
                        return;
                    }
                }

                // خصم الكميات من المخزون
                setProducts(prevProducts => prevProducts.map(p => {
                    const orderedItem = soData.items.find(i => i.productId === p.id);
                    if (orderedItem) {
                        return { ...p, stock: p.stock - parseInt(orderedItem.qty) };
                    }
                    return p;
                }));

                const newSO = {
                    id: 'so-' + Date.now(),
                    orderNo: `SO-2026-${Math.floor(100 + Math.random() * 900)}`,
                    customerId: soData.customerId,
                    date: new Date().toISOString().split('T')[0],
                    status: 'قيد المعالجة',
                    items: soData.items,
                    total: soData.total
                };

                setSalesOrders([newSO, ...salesOrders]);
                setIsSalesModalOpen(false);
                showToast(`تم إصدار أمر البيع ${newSO.orderNo} وتحديث المخزون.`);
            };

            // إنشاء أمر شراء والتعامل مع استلام البضائع
            const handleCreatePurchaseOrder = (poData) => {
                const newPO = {
                    id: 'po-' + Date.now(),
                    poNo: `PO-2026-${Math.floor(100 + Math.random() * 900)}`,
                    supplier: poData.supplier,
                    warehouseId: poData.warehouseId,
                    date: new Date().toISOString().split('T')[0],
                    status: poData.receiveNow ? 'تم الاستلام' : 'معلق',
                    items: poData.items,
                    total: poData.total
                };

                if (poData.receiveNow) {
                    // زيادة المخزون فوراً
                    setProducts(prevProducts => prevProducts.map(p => {
                        const poItem = poData.items.find(i => i.productId === p.id);
                        if (poItem) {
                            return { ...p, stock: p.stock + parseInt(poItem.qty) };
                        }
                        return p;
                    }));
                }

                setPurchaseOrders([newPO, ...purchaseOrders]);
                setIsPurchaseModalOpen(false);
                showToast(`تم إنشاء أمر الشراء ${newPO.poNo}! ${poData.receiveNow ? 'تم إيداع المنتجات بالمخزن.' : ''}`);
            };

            // تأكيد استلام أمر شراء معلق
            const handleReceivePO = (poId) => {
                const po = purchaseOrders.find(p => p.id === poId);
                if (!po || po.status === 'تم الاستلام') return;

                // إيداع الشحنة في المخزن
                setProducts(prevProducts => prevProducts.map(p => {
                    const poItem = po.items.find(i => i.productId === p.id);
                    if (poItem) {
                        return { ...p, stock: p.stock + parseInt(poItem.qty) };
                    }
                    return p;
                }));

                // تحديث حالة أمر الشراء
                setPurchaseOrders(prev => prev.map(p => p.id === poId ? { ...p, status: 'تم الاستلام' } : p));
                showToast(`تم استلام شحنة أمر الشراء ${po.poNo} في المستودع!`);
            };

            // نقل الكميات بين المستودعات
            const handleStockTransfer = (transferData) => {
                const { productId, fromWarehouseId, toWarehouseId, qty } = transferData;
                const quantity = parseInt(qty);
                const product = products.find(p => p.id === productId);

                if (!product || product.stock < quantity) {
                    showToast('الكمية المتوفرة في المخزن غير كافية للنقل!', 'error');
                    return;
                }

                // تغيير المستودع المخصص للمنتج
                setProducts(prev => prev.map(p => {
                    if (p.id === productId) {
                        return { ...p, warehouseId: toWarehouseId };
                    }
                    return p;
                }));

                setIsTransferModalOpen(false);
                showToast(`تم نقل ${quantity} وحدة من ${product.name} إلى المستودع المستهدف.`);
            };

            // إعادة ضبط البيانات الافتراضية
            const handleResetData = () => {
                setProducts(initialProducts);
                setWarehouses(initialWarehouses);
                setCustomers(initialCustomers);
                setSalesOrders(initialSalesOrders);
                setPurchaseOrders(initialPurchaseOrders);
                localStorage.clear();
                showToast('تمت إعادة ضبط البيانات الافتراضية بنجاح!', 'warning');
            };

            return (
                <div className="flex h-screen overflow-hidden bg-slate-100">
                    
                    {/* التنبيهات المنبثقة */}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}

                    {/* القائمة الجانبية للتنقل */}
                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex border-l border-slate-800">
                        <div>
                            {/* شعار النظام */}
                            <div className="h-16 flex items-center px-6 border-b border-slate-800 gap-3">
                                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-black text-lg shadow-lg shadow-indigo-500/30">
                                    ن
                                </div>
                                <div className="flex flex-col">
                                    <span className="font-bold text-white text-lg tracking-wide leading-tight">نيكس ERP</span>
                                    <span className="text-[10px] text-slate-400">إدارة المشاريع المتكاملة</span>
                                </div>
                            </div>

                            {/* عناصر القائمة الجانبية */}
                            <nav className="p-4 space-y-1.5">
                                <p className="px-3 text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-2">الوحدات الرئيسية</p>
                                
                                <NavItem 
                                    icon="fa-chart-pie" 
                                    label="لوحة التحكم" 
                                    active={activeTab === 'dashboard'} 
                                    onClick={() => setActiveTab('dashboard')} 
                                />
                                <NavItem 
                                    icon="fa-box-archive" 
                                    label="المنتجات والمخزون" 
                                    badge={lowStockItems.length ? lowStockItems.length : null}
                                    active={activeTab === 'products'} 
                                    onClick={() => setActiveTab('products')} 
                                />
                                <NavItem 
                                    icon="fa-warehouse" 
                                    label="المستودعات والمخازن" 
                                    active={activeTab === 'repository'} 
                                    onClick={() => setActiveTab('repository')} 
                                />
                                <NavItem 
                                    icon="fa-file-invoice-dollar" 
                                    label="أوامر البيع" 
                                    active={activeTab === 'sales'} 
                                    onClick={() => setActiveTab('sales')} 
                                />
                                <NavItem 
                                    icon="fa-cart-flatbed" 
                                    label="أوامر الشراء" 
                                    active={activeTab === 'purchase'} 
                                    onClick={() => setActiveTab('purchase')} 
                                />
                                <NavItem 
                                    icon="fa-users" 
                                    label="إدارة العملاء (CRM)" 
                                    active={activeTab === 'customers'} 
                                    onClick={() => setActiveTab('customers')} 
                                />
                            </nav>
                        </div>

                        {/* أسفل القائمة الجانبية */}
                        <div className="p-4 border-t border-slate-800 space-y-3">
                            <button 
                                onClick={handleResetData}
                                className="w-full flex items-center justify-center gap-2 text-xs text-slate-400 hover:text-rose-400 py-2.5 border border-slate-800 rounded-xl hover:border-rose-900/50 hover:bg-rose-950/20 transition font-medium"
                            >
                                <i className="fa-solid fa-rotate-right"></i>
                                <span>استعادة البيانات الافتراضية</span>
                            </button>

                            <div className="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-slate-800/60 border border-slate-800">
                                <div className="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold text-xs">
                                    م
                                </div>
                                <div className="flex-1 overflow-hidden">
                                    <p className="text-xs font-semibold text-slate-200 truncate">مدير النظام</p>
                                    <p className="text-[10px] text-slate-400 truncate">admin@nexerp.sa</p>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* منطقة المحتوى الرئيسية */}
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        
                        {/* الشريط العلوي */}
                        <header className="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10">
                            {/* العنوان واستجابة الهاتف */}
                            <div className="flex items-center gap-3">
                                <div className="md:hidden flex items-center">
                                    <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">ن</div>
                                </div>
                                <h1 className="text-lg font-bold text-slate-800">
                                    {activeTab === 'dashboard' && 'لوحة التحكم الاستراتيجية'}
                                    {activeTab === 'products' && 'كتالوج المنتجات والمخزون'}
                                    {activeTab === 'repository' && 'إدارة المستودعات والمراكز اللوجستية'}
                                    {activeTab === 'sales' && 'سجل أوامر البيع والمبيعات'}
                                    {activeTab === 'purchase' && 'إدارة المشتريات والموردين'}
                                    {activeTab === 'customers' && 'دليل العملاء والحسابات'}
                                </h1>
                            </div>

                            {/* الإجراءات السريعة */}
                            <div className="flex items-center gap-3">
                                {lowStockItems.length > 0 && (
                                    <div className="flex items-center gap-2 px-3 py-1.5 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-xs font-bold">
                                        <i className="fa-solid fa-triangle-exclamation text-amber-500 animate-pulse"></i>
                                        <span>{lowStockItems.length} تنبيه مخزون منخفض</span>
                                    </div>
                                )}

                                {/* زر القائمة المنسدلة للإضافة */}
                                <div className="relative group">
                                    <button className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-md shadow-indigo-200 flex items-center gap-2 transition">
                                        <i className="fa-solid fa-plus"></i>
                                        <span>إجراء جديد</span>
                                    </button>
                                    <div className="absolute left-0 top-full mt-2 w-48 bg-white border border-slate-200 rounded-2xl shadow-xl hidden group-hover:block z-50 p-1.5">
                                        <button onClick={() => setIsSalesModalOpen(true)} className="w-full text-right px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 rounded-xl flex items-center gap-2">

                <div className="space-y-4 text-xs">
                    <div>
                        <label className="block font-bold text-slate-700 mb-1">اسم المورد / الشركة التابعة</label>
                        <input type="text" required placeholder="مثال: شركة التجهيزات الصناعية" value={supplier} onChange={e => setSupplier(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>

                    <div>
                        <label className="block font-bold text-slate-700 mb-1">المستودع المستلم</label>
                        <select value={warehouseId} onChange={e => setWarehouseId(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold">
                            {warehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                        </select>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        <div>
                            <label className="block font-bold text-slate-700 mb-1">المنتج المراد شراؤه</label>
                            <select value={selectedProductId} onChange={e => setSelectedProductId(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold">
                                {products.map(p => <option key={p.id} value={p.id}>{p.name} (${p.cost})</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block font-bold text-slate-700 mb-1">الكمية المطلوب توريدها</label>
                            <input type="number" min="1" value={qty} onChange={e => setQty(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" />
                        </div>
                    </div>

                    <div className="flex items-center gap-2 py-2">
                        <input type="checkbox" id="recNow" checked={receiveNow} onChange={e => setReceiveNow(e.target.checked)} className="rounded text-indigo-600 focus:ring-0" />
                        <label htmlFor="recNow" className="text-slate-700 font-bold">إيداع الكمية في المستودع فوراً عند الحفظ</label>
                    </div>

                    <div className="flex justify-between items-center pt-3 border-t text-sm font-extrabold">
                        <span>إجمالي التكلفة:</span>
                        <span className="text-emerald-600">${total.toFixed(2)}</span>
                    </div>

                    <button 
                        disabled={!supplier}
                        onClick={() => onSubmit({
                            supplier,
                            warehouseId,
                            items: [{ productId: selectedProductId, qty: parseInt(qty), cost: selectedProduct.cost }],
                            total,
                            receiveNow
                        })} 
                        className="w-full py-3 bg-indigo-600 disabled:opacity-50 text-white font-bold rounded-xl transition shadow-md shadow-indigo-100"
                    >
                        حفظ وإصدار أمر الشراء
                    </button>
                </div>
            );
        }

        // نموذج مناقلة بين المستودعات
        function StockTransferForm({ warehouses, products, onSubmit }) {
            const [productId, setProductId] = useState(products[0]?.id || '');
            const [fromWh, setFromWh] = useState(warehouses[0]?.id || '');
            const [toWh, setToWh] = useState(warehouses[1]?.id || warehouses[0]?.id || '');
            const [qty, setQty] = useState(1);

            return (
                <div className="space-y-4 text-xs">
                    <div>
                        <label className="block font-bold text-slate-700 mb-1">المنتج المراد نقل شحنته</label>
                        <select value={productId} onChange={e => setProductId(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold">
                            {products.map(p => <option key={p.id} value={p.id}>{p.name} (المتوفر: {p.stock})</option>)}
                        </select>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                        <div>
                            <label className="block font-bold text-slate-700 mb-1">من مستودع</label>
                            <select value={fromWh} onChange={e => setFromWh(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold">
                                {warehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block font-bold text-slate-700 mb-1">إلى مستودع</label>
                            <select value={toWh} onChange={e => setToWh(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold">
                                {warehouses.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                            </select>
                        </div>
                    </div>

                    <div>
                        <label className="block font-bold text-slate-700 mb-1">الكمية المنقولة</label>
                        <input type="number" min="1" value={qty} onChange={e => setQty(e.target.value)} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl" />
                    </div>

                    <button 
                        onClick={() => onSubmit({ productId, fromWarehouseId: fromWh, toWarehouseId: toWh, qty })}
                        className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl transition shadow-md shadow-indigo-100"
                    >
                        تنفيذ عملية المناقلة
                    </button>
                </div>
            );
        }

        function KpiCard({ title, value, icon, color, subText }) {
            const colorClasses = {
                indigo: 'bg-indigo-50 text-indigo-600',
                emerald: 'bg-emerald-50 text-emerald-600',
                amber: 'bg-amber-50 text-amber-600',
                sky: 'bg-sky-50 text-sky-600'
            };

            return (
                <div className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div className="flex justify-between items-start mb-3">
                        <div>
                            <span className="text-xs font-bold text-slate-500 block mb-1">{title}</span>
                            <span className="text-xl font-black text-slate-900">{value}</span>
                        </div>
                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold ${colorClasses[color]}`}>
                            <i className={`fa-solid ${icon} text-lg`}></i>
                        </div>
                    </div>
                    <p className="text-[10px] font-semibold text-slate-400 border-t border-slate-100 pt-2">{subText}</p>
                </div>
            );
        }

        function StatusBadge({ status }) {
            const styles = {
                'مكتمل': 'bg-emerald-100 text-emerald-800',
                'تم الاستلام': 'bg-emerald-100 text-emerald-800',
                'قيد المعالجة': 'bg-indigo-100 text-indigo-800',
                'معلق': 'bg-amber-100 text-amber-800',
                'نشط': 'bg-emerald-100 text-emerald-800'
            };

            return (
                <span className={`px-2.5 py-1 rounded-full font-bold text-[10px] inline-block ${styles[status] || 'bg-slate-100 text-slate-700'}`}>
                    {status}
                </span>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
